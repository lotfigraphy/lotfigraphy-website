<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LOTFIGRAPHY — Galerie privée</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .private-gallery-page {
      min-height: 100vh;
      padding: 130px 7vw 80px;
      background: #0d0d0c;
    }

    .private-gallery-head {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 55px;
    }

    .private-gallery-head h1 {
      font-size: clamp(42px, 7vw, 78px);
      font-weight: 500;
      line-height: 1.05;
      margin: 18px 0;
    }

    .private-gallery-head p {
      color: var(--muted);
      line-height: 1.8;
    }

    .event-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 1200px;
      margin: auto;
    }

    .event-gallery img {
      width: 100%;
      height: 390px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: opacity .25s ease;
    }

    .event-gallery img:hover {
      opacity: .85;
    }

    .private-message {
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
      padding: 45px 25px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .private-message h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
    }

    .private-message p {
      color: var(--muted);
      line-height: 1.8;
    }

    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: var(--gold);
    }

    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.96);
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      touch-action: pan-y;
      cursor: zoom-in;
      transition: transform .25s ease;
    }

    .lightbox img.zoomed {
      transform: scale(2);
      cursor: zoom-out;
      touch-action: none;
    }

    .lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      border: 0;
      background: none;
      color: white;
      font-size: 42px;
      cursor: pointer;
      z-index: 100001;
      line-height: 1;
    }

    .lightbox-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(0,0,0,.55);
      color: white;
      border-radius: 50%;
      font-size: 32px;
      cursor: pointer;
      z-index: 100000;
    }

    .lightbox-prev {
      left: 20px;
    }

    .lightbox-next {
      right: 20px;
    }

    .lightbox-download {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: #111;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 5px;
      z-index: 100001;
    }

    @media (max-width: 800px) {

      .event-gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .event-gallery img {
        height: 260px;
      }

      .lightbox img {
        max-width: 94vw;
        max-height: 78vh;
      }

      .lightbox-btn {
        width: 42px;
        height: 42px;
        font-size: 27px;
      }

      .lightbox-prev {
        left: 8px;
      }

      .lightbox-next {
        right: 8px;
      }

    }

  </style>

</head>

<body>

<header class="navbar">

  <a class="brand" href="index.html">

    <img
      src="assets/logo.jpeg"
      alt="LOTFIGRAPHY logo"
    >

    <span>LOTFIGRAPHY</span>

  </a>

  <a href="index.html">
    Accueil
  </a>

</header>


<main class="private-gallery-page">

  <div id="galleryContent"></div>

</main>


<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

  <button
    class="lightbox-close"
    id="lightboxClose"
    aria-label="Fermer"
  >
    ×
  </button>

  <button
    class="lightbox-btn lightbox-prev"
    id="lightboxPrev"
    aria-label="Photo précédente"
  >
    ‹
  </button>

  <img
    id="lightboxImage"
    src=""
    alt="Photo LOTFIGRAPHY"
  >

  <button
    class="lightbox-btn lightbox-next"
    id="lightboxNext"
    aria-label="Photo suivante"
  >
    ›
  </button>

  <a
    id="lightboxDownload"
    class="lightbox-download"
    href=""
    download
  >
    ↓ Télécharger
  </a>

</div>


<script>

const events = {

  "chaimae-mimoun": {

    title: "CHAIMAE & MIMOUN",

    subtitle: "LOTFIGRAPHY",

    photos: [
      "001.jpg",
      "002.jpg",
      "003.jpg",
      "004.jpg",
      "005.jpg",
      "006.jpg",
      "007.jpg",
      "008.jpg",
      "009.jpg",
      "010.jpg",
      "011.jpg",
      "012.jpg",
      "013.jpg",
      "014.jpg",
      "015.jpg",
      "016.jpg",
      "017.jpg",
      "018.jpg",
      "019.jpg",
      "020.jpg",
      "021.jpg",
      "022.jpg",
      "023.jpg",
      "024.jpg",
      "025.jpg",
      "026.jpg",
      "027.jpg",
      "028.jpg"
    ]

  }

};


const eventId =
  new URLSearchParams(
    window.location.search
  ).get("event");


const content =
  document.getElementById("galleryContent");


if (!eventId || !events[eventId]) {

  content.innerHTML = `

    <div class="private-message">

      <div class="section-label">
        GALERIE PRIVÉE
      </div>

      <h2>
        Accès réservé
      </h2>

      <p>
        Cette galerie est accessible uniquement
        avec le QR code fourni par LOTFIGRAPHY.
      </p>

      <a
        class="back-home"
        href="index.html"
      >
        ← Retour à l'accueil
      </a>

    </div>

  `;

} else {

  const event = events[eventId];

  content.innerHTML = `

    <div class="private-gallery-head">

      <div class="section-label">
        ${event.subtitle}
      </div>

      <h1>
        ${event.title}
      </h1>

      <p>
        Merci de faire confiance à LOTFIGRAPHY
        pour conserver vos souvenirs.
      </p>

    </div>

    <div class="event-gallery">

      ${event.photos.map((photo, i) => `

        <img
          src="${photo}"
          alt="Photo de l'événement ${i + 1}"
          loading="lazy"
        >

      `).join("")}

    </div>

  `;

}


/* =========================
   LIGHTBOX JAVASCRIPT
========================= */

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const lightboxDownload =
  document.getElementById("lightboxDownload");

const closeBtn =
  document.getElementById("lightboxClose");

const prevBtn =
  document.getElementById("lightboxPrev");

const nextBtn =
  document.getElementById("lightboxNext");


let currentPhoto = 0;

let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;


function getGalleryImages() {

  return Array.from(
    document.querySelectorAll(
      ".event-gallery img"
    )
  );

}


function showPhoto(index) {

  const images =
    getGalleryImages();

  if (!images.length) return;

  currentPhoto =
    (index + images.length) %
    images.length;

  const src =
    images[currentPhoto].src;

  lightboxImage.src = src;

  lightboxDownload.href = src;

  lightboxImage.classList.remove("zoomed");

  lightbox.classList.add("active");

  document.body.style.overflow =
    "hidden";

}


function closeLightbox() {

  lightbox.classList.remove("active");

  lightboxImage.classList.remove("zoomed");

  lightboxImage.src = "";

  document.body.style.overflow =
    "";

}


function nextPhoto() {

  showPhoto(
    currentPhoto + 1
  );

}


function previousPhoto() {

  showPhoto(
    currentPhoto - 1
  );

}


/* CLICK SUR PHOTO */

document.addEventListener(
  "click",
  function(e) {

    const image =
      e.target.closest(
        ".event-gallery img"
      );

    if (!image) return;

    const images =
      getGalleryImages();

    const index =
      images.indexOf(image);

    showPhoto(index);

  }
);


/* DOUBLE TAP / DOUBLE CLICK = ZOOM */

lightboxImage.addEventListener(
  "dblclick",
  function(e) {

    e.preventDefault();

    lightboxImage.classList.toggle(
      "zoomed"
    );

  }
);


/* SWIPE MOBILE */

lightbox.addEventListener(
  "touchstart",
  function(e) {

    if (
      lightboxImage.classList.contains(
        "zoomed"
      )
    ) return;

    const touch =
      e.changedTouches[0];

    touchStartX =
      touch.clientX;

    touchStartY =
      touch.clientY;

    touchMoved = false;

  },
  { passive: true }
);


lightbox.addEventListener(
  "touchmove",
  function(e) {

    if (
      lightboxImage.classList.contains(
        "zoomed"
      )
    ) return;

    const touch =
      e.changedTouches[0];

    const dx =
      Math.abs(
        touch.clientX - touchStartX
      );

    const dy =
      Math.abs(
        touch.clientY - touchStartY
      );

    if (dx > 10 || dy > 10) {

      touchMoved = true;

    }

  },
  { passive: true }
);


lightbox.addEventListener(
  "touchend",
  function(e) {

    if (
      lightboxImage.classList.contains(
        "zoomed"
      )
    ) return;

    const touch =
      e.changedTouches[0];

    const diffX =
      touch.clientX - touchStartX;

    const diffY =
      touch.clientY - touchStartY;

    if (
      touchMoved &&
      Math.abs(diffX) > 60 &&
      Math.abs(diffX) > Math.abs(diffY)
    ) {

      if (diffX < 0) {

        nextPhoto();

      } else {

        previousPhoto();

      }

    }

  },
  { passive: true }
);


/* BOUTONS */

closeBtn.addEventListener(
  "click",
  closeLightbox
);

nextBtn.addEventListener(
  "click",
  nextPhoto
);

prevBtn.addEventListener(
  "click",
  previousPhoto
);


/* CLICK SUR FOND */

lightbox.addEventListener(
  "click",
  function(e) {

    if (e.target === lightbox) {

      closeLightbox();

    }

  }
);


/* CLAVIER */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      !lightbox.classList.contains(
        "active"
      )
    ) return;

    if (e.key === "Escape") {

      closeLightbox();

    }

    if (e.key === "ArrowRight") {

      nextPhoto();

    }

    if (e.key === "ArrowLeft") {

      previousPhoto();

    }

  }
);

</script>

</body>
</html>
