<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOTFIGRAPHY — Galerie privée</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .private-gallery-page {
      min-height: 100vh;
      padding: 130px 7vw 80px;
      background: #0d0d0c;
    }

    .private-gallery-head {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 55px;
    }

    .private-gallery-head h1 {
      font-size: clamp(42px, 7vw, 78px);
      font-weight: 500;
      line-height: 1.05;
      margin: 18px 0;
    }

    .private-gallery-head h1 em {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
    }

    .private-gallery-head p {
      color: var(--muted);
      line-height: 1.8;
    }

    .event-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 1200px;
      margin: auto;
    }

    .event-gallery img {
      width: 100%;
      height: 390px;
      object-fit: cover;
      display: block;
    }

    .private-message {
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
      padding: 45px 25px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .private-message h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
    }

    .private-message p {
      color: var(--muted);
      line-height: 1.8;
    }

    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: var(--gold);
    }

    @media (max-width: 800px) {
      .event-gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .event-gallery img {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">
  <a class="brand" href="index.html">
    <img src="assets/logo.jpeg" alt="LOTFIGRAPHY logo">
    <span>LOTFIGRAPHY</span>
  </a>

  <a href="index.html">Accueil</a>
</header>

<main class="private-gallery-page">

  <div id="galleryContent"></div>

</main>

<script>

const events = {

  demo: {
    title: "Galerie de votre événement",
    subtitle: "LOTFIGRAPHY",

    photos: [
  "001.jpg",
  "002.jpg",
  "003.jpg",
  "004.jpg",
  "005.jpg",
  "006.jpg",
  "007.jpg",
  "008.jpg",
  "009.jpg",
  "010.jpg",
  "011.jpg",
  "012.jpg",
  "013.jpg",
  "014.jpg",
  "015.jpg",
  "016.jpg",
  "017.jpg",
  "018.jpg",
  "019.jpg",
  "020.jpg",
  "021.jpg",
  "022.jpg",
  "023.jpg",
  "024.jpg",
  "025.jpg",
  "026.jpg",
  "027.jpg",
  "028.jpg"
]

    ]
  }

};


const eventId =
  new URLSearchParams(window.location.search).get("event");

const content =
  document.getElementById("galleryContent");


if (!eventId || !events[eventId]) {

  content.innerHTML = `

    <div class="private-message">

      <div class="section-label">
        GALERIE PRIVÉE
      </div>

      <h2>
        Accès réservé
      </h2>

      <p>
        Cette galerie est accessible uniquement
        avec le QR code fourni par LOTFIGRAPHY.
      </p>

      <a class="back-home" href="index.html">
        ← Retour à l'accueil
      </a>

    </div>

  `;

} else {

  const event = events[eventId];

  content.innerHTML = `

    <div class="private-gallery-head">

      <div class="section-label">
        ${event.subtitle}
      </div>

      <h1>
        ${event.title}
      </h1>

      <p>
        Merci de faire confiance à LOTFIGRAPHY
        pour conserver vos souvenirs.
      </p>

    </div>

    <div class="event-gallery">

      ${event.photos.map((photo, i) => `

        <img
          src="${photo}"
          alt="Photo de l'événement ${i + 1}"
          loading="lazy"
        >

      `).join("")}

    </div>

  `;

}

</script>

</body>
</html>
